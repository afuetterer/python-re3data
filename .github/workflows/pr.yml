name: Checks

on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review # this is needed to trigger checks, when an auto-generated "draft" PR is set for "ready for review".

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

# Set permissions at the job level.
permissions: {}

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1
  UV_LOCKED: true # do not update the lockfile during `uv sync` and `uv run` commands

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docs:
    # disables this workflow from running in a repository that is not part of the indicated organization/user
    if: github.repository_owner == 'afuetterer'
    runs-on: ubuntu-24.04
    steps:
    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v3
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: '3.13'
        enable-cache: true
        prune-cache: false
        cache-suffix: docs
    - run: just sync-docs
    - run: just docs-build

  required-checks-pass:
    if: always()
    needs:
    - test
    - docs
    runs-on: ubuntu-24.04
    steps:
    - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}
